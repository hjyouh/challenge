<!doctype html>
<html lang="ko">
  <head>
    
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#161513" />
    <script>if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js')</script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="디인챌" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="./assets/images/angel-icon.png" />
    <style>html,body{background:#161513}#splash{position:fixed;inset:0;z-index:9999;background:#161513;display:flex;align-items:center;justify-content:center;pointer-events:none}</style>
    <link rel="stylesheet" href="./css/styles.css?v=v42" />
    <meta property="og:title" content="디인챌 출석 체크" />
    <meta property="og:description" content="천사님 인스타 챌린지 출석 체크" />
    <meta property="og:image" content="https://angelsinstachallenge.vercel.app/assets/images/og-image.png" />
    <meta property="og:url" content="https://angelsinstachallenge.vercel.app" />
    <meta property="og:type" content="website" />
    <title>디인챌 출석 체크</title>
  </head>
  <body data-page="home">
    <div id="splash"><img src="./assets/images/angel-intro.png" alt="" /></div>
    <main class="phone">
      <header class="page-header">
        <h1>천사님 인스타 챌린지</h1>
      </header>

      <section class="mission-meta">
        <div class="mission-label">오늘의 미션</div>
        <div class="circle-date" id="circleDate"></div>
      </section>

      <section class="mission-stage" id="missionStage">
        <div class="angel" id="angel"></div>
        <div class="arrow" id="arrow"></div>
        <div class="mission-diagonal-message" id="messageArea"></div>

        <button class="mission-circle" id="attendanceButton" type="button" aria-label="출석 체크">
          <span class="circle-bag" id="circleBag"></span>
          <span class="circle-state" id="circleState"></span>
        </button>
      </section>

      <section class="attendance-board">
        <div class="board-head">
          <h2 id="monthTitle">출석부</h2>
          <span class="soft-pill" id="monthRate"></span>
        </div>
        <div class="pouch-grid" id="pouchGrid"></div>
      </section>

      <section class="monthly-mission" aria-label="이달의 미션">
        <h2>이달의 미션</h2>
        <p class="mission-score" id="missionScore"></p>
        <p>달성하셨습니다.<br />복 많이 받으세요.</p>
      </section>
    </main>

    <nav class="bottom-nav">
      <a class="active" href="./index.html"><img class="nav-icon" src="./assets/images/home.png" alt="" />홈</a>
      <a href="./pages/attendance.html"><img class="nav-icon" src="./assets/images/attendance.png" alt="" />출석부</a>
      <a href="./pages/ranking.html"><img class="nav-icon" src="./assets/images/ranking.png" alt="" />랭킹</a>
      <a href="./pages/my.html"><img class="nav-icon" src="./assets/images/user-avatar.png" alt="" />마이</a>
    </nav>

    <script src="./js/imported-data.js?v=data2"></script>
    <script src="./js/common.js?v=common11"></script>
    <script src="./js/auth-guard.js?v=auth5"></script>
    <script src="./js/home.js?v=home37"></script>
  </body>
</html>
