<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <!-- v20260603 -->
  <title>디인챌 어드민</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #ffffff;
      color: #1e293b;
      font-size: 14px;
      min-height: 100vh;
    }

    /* ── Login ── */
    #loginScreen {
      display: flex; align-items: center; justify-content: center; min-height: 100vh;
      background: #f8fafc;
    }
    .login-box {
      background: #ffffff; border: 1px solid #e2e8f0;
      border-radius: 16px; padding: 32px 28px; width: 320px; max-width: calc(100vw - 48px); text-align: center;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }
    .login-box h1 { font-size: 22px; margin-bottom: 6px; color: #0f172a; }
    .login-box p  { color: #64748b; font-size: 14px; margin-bottom: 32px; }
    .login-box input {
      width: 100%; background: #f8fafc; border: 1px solid #e2e8f0;
      border-radius: 8px; padding: 12px 16px; color: #0f172a; font-size: 16px;
      margin-bottom: 12px; outline: none;
    }
    .login-box input:focus { border-color: #f59e0b; }
    .login-box button {
      width: 100%; background: #f59e0b; color: #ffffff; border: none;
      border-radius: 8px; padding: 12px; font-size: 16px; font-weight: 700; cursor: pointer;
    }
    .login-box button:hover { background: #d97706; }
    .login-error { color: #ef4444; font-size: 13px; margin-top: 12px; min-height: 20px; }

    /* ── Dashboard layout ── */
    #dashboard { display: flex; min-height: 100vh; }

    .sidebar {
      width: 220px; background: #1e293b;
      border-right: 1px solid #e2e8f0;
      display: flex; flex-direction: column;
      position: fixed; top: 0; left: 0; bottom: 0;
    }
    .sidebar-brand { padding: 20px 18px 16px; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .sidebar-brand h1 { font-size: 15px; font-weight: 700; color: #f1f5f9; }
    .sidebar-brand p  { color: #94a3b8; font-size: 12px; margin-top: 3px; }

    .nav-item {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 18px; cursor: pointer; color: #ffffff; font-size: 16px;
      border-left: 3px solid transparent; user-select: none; transition: all 0.12s;
    }
    .nav-item:hover  { background: rgba(255,255,255,0.08); color: #ffffff; }
    .nav-item.active { color: #facc15; border-left-color: #facc15; background: rgba(250,204,21,0.08); }

    .sidebar-footer { margin-top: auto; padding: 14px 18px; border-top: 1px solid rgba(255,255,255,0.1); }
    .btn-logout {
      width: 100%; background: transparent; border: 1px solid rgba(255,255,255,0.18);
      color: #94a3b8; border-radius: 8px; padding: 8px; cursor: pointer; font-size: 13px;
    }
    .btn-logout:hover { background: rgba(255,255,255,0.06); color: #f1f5f9; }

    .main-content { margin-left: 220px; flex: 1; padding: 28px 36px; background: #ffffff; }

    /* ── Tab header ── */
    .tab-title { font-size: 16px; font-weight: 700; color: #0f172a; }

    .inline-tabs {
      display: flex; align-items: center; gap: 4px;
      border-bottom: 2px solid #e2e8f0; margin: 0; padding: 0;
      position: sticky; top: 0; background: #ffffff; z-index: 10;
    }
    .inline-tab {
      padding: 6px 14px 8px; cursor: pointer; font-size: 14px; font-weight: 700;
      color: #94a3b8; border: none; background: none;
      border-bottom: 2px solid transparent; margin-bottom: -2px; white-space: nowrap;
    }
    .inline-tab:hover { color: #475569; }
    .inline-tab.active { color: #d97706; border-bottom-color: #d97706; }

    /* ── Rank switch tabs ── */
    .rank-tabs-wrap {
      display: flex; align-items: center; gap: 0;
      border-bottom: 2px solid #e2e8f0; margin-bottom: 0; margin-top: 0;
      overflow-x: auto; scrollbar-width: none;
      position: sticky; top: 38px; background: #ffffff; z-index: 9;
    }
    .rank-tabs-wrap::-webkit-scrollbar { display: none; }
    .rank-tab {
      flex: 0 0 auto; padding: 8px 18px 10px; cursor: pointer;
      color: #94a3b8; font-size: 14px; font-weight: 700;
      border-bottom: 2px solid transparent; margin-bottom: -2px; white-space: nowrap;
      background: none; border-top: none; border-left: none; border-right: none;
    }
    .rank-tab:hover { color: #475569; }
    .rank-tab.active { color: #16a34a; border-bottom-color: #16a34a; }

    /* ── 3-column grid ── */
    .three-col {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      overflow: hidden;
    }
    .col-panel { border-right: 1px solid #e2e8f0; overflow-x: auto; }
    .col-panel:last-child { border-right: none; }

    /* ── Member row ── */
    .tab-title-row {
      display: flex; align-items: center; gap: 12px; margin-bottom: 20px; flex-wrap: wrap;
    }
    .tab-title { font-size: 16px; font-weight: 700; color: #0f172a; margin-bottom: 0; }
    .attend-summary-chips {
      display: flex; gap: 8px; flex-wrap: wrap;
    }
    .attend-chip {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 3px 10px; border-radius: 99px; font-size: 12px; font-weight: 600;
    }
    .attend-chip.total  { background: #f1f5f9; color: #475569; }
    .attend-chip.active { background: #dbeafe; color: #1d4ed8; }
    .attend-chip.rate   { background: #dcfce7; color: #16a34a; }

    .member-row {
      display: grid;
      grid-template-columns: 72px 96px 72px 44px 56px;
      align-items: center;
      justify-items: center;
      gap: 3px;
      padding: 8px 10px;
      border-bottom: 1px solid #f1f5f9;
      font-size: 12px !important;
    }
    .member-row .col-id, .member-row .col-nick, .member-row .col-insta { justify-self: start; width: 100%; }
    .row-actions { display: flex; align-items: center; gap: 6px; }
    .delete-btn {
      background: none; border: none; cursor: pointer; padding: 2px 4px;
      color: #ef4444; font-size: 13px; font-weight: 700; opacity: 0.75;
      line-height: 1; flex-shrink: 0;
    }
    .delete-btn:hover { opacity: 1; }
    .member-row:last-child { border-bottom: none; }
    .member-row:hover { background: #f8fafc; }
    .member-row .col-id    { color: #0f172a !important; font-weight: 400 !important; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .member-row .col-nick  { color: #0f172a !important; font-weight: 400 !important; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .member-row .col-insta { color: #0f172a !important; font-weight: 400 !important; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .col-header {
      display: grid;
      grid-template-columns: 72px 96px 72px 44px 56px;
      justify-items: center;
      gap: 3px;
      padding: 8px 10px;
      background: #f8fafc;
      border-bottom: 1px solid #e2e8f0;
      font-size: 11px; color: #94a3b8; font-weight: 700; text-transform: uppercase; letter-spacing: .05em;
    }

    .sep-line {
      grid-column: 1 / -1;
      height: 1px;
      background: linear-gradient(90deg, transparent, #cbd5e1, transparent);
    }

    .reset-btn {
      background: none; border: none; cursor: pointer; padding: 2px; opacity: 0.75;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .reset-btn:hover { opacity: 0.9; }
    .reset-btn img { width: 16px; height: 16px; filter: none; }

    /* ── Attendance row ── */
    .attend-row {
      display: grid;
      grid-template-columns: 32px 22px minmax(0,1fr) 80px 40px;
      align-items: center;
      gap: 4px;
      padding: 7px 12px;
      border-bottom: 1px solid #f1f5f9;
      font-size: 14px;
      color: #334155;
    }
    .attend-row:last-child { border-bottom: none; }
    .attend-row:hover { background: #f8fafc; }

    .attend-header {
      display: grid;
      grid-template-columns: 32px 22px minmax(0,1fr) 80px 40px;
      gap: 4px;
      padding: 7px 12px;
      background: #f8fafc;
      border-bottom: 1px solid #e2e8f0;
      font-size: 11px; color: #94a3b8; font-weight: 700; text-transform: uppercase; letter-spacing: .04em;
    }

    .pct-badge {
      display: inline-block; padding: 1px 7px; border-radius: 99px;
      font-size: 11px; font-weight: 700;
    }
    .pct-green  { background: #dcfce7; color: #16a34a; }
    .pct-yellow { background: #fef9c3; color: #ca8a04; }
    .pct-gray   { background: #f1f5f9; color: #94a3b8; }

    /* ── Password Change Modal ── */
    #pwModal {
      display: none; position: fixed; inset: 0; z-index: 1000;
      background: rgba(0,0,0,0.45); align-items: center; justify-content: center;
    }
    #pwModal.open { display: flex; }
    .pw-box {
      background: #ffffff; border: 1px solid #e2e8f0;
      border-radius: 16px; padding: 32px 28px; width: 320px; max-width: calc(100vw - 48px); text-align: center;
      box-shadow: 0 4px 24px rgba(0,0,0,0.18);
    }
    .pw-box h2 { font-size: 18px; margin-bottom: 6px; color: #0f172a; }
    .pw-box p  { color: #64748b; font-size: 13px; margin-bottom: 24px; }
    .pw-box input {
      width: 100%; background: #f8fafc; border: 1px solid #e2e8f0;
      border-radius: 8px; padding: 12px 16px; color: #0f172a; font-size: 16px;
      margin-bottom: 10px; outline: none;
    }
    .pw-box input:focus { border-color: #f59e0b; }
    .pw-box-btns { display: flex; gap: 8px; margin-top: 4px; }
    .pw-box-btns button {
      flex: 1; border: none; border-radius: 8px; padding: 12px; font-size: 15px; font-weight: 700; cursor: pointer;
    }
    .btn-pw-cancel { background: #f1f5f9; color: #64748b; }
    .btn-pw-cancel:hover { background: #e2e8f0; }
    .btn-pw-confirm { background: #f59e0b; color: #ffffff; }
    .btn-pw-confirm:hover { background: #d97706; }
    .pw-error { color: #ef4444; font-size: 13px; margin-top: 8px; min-height: 18px; }

    .btn-change-pw {
      width: 100%; background: transparent; border: 1px solid rgba(255,255,255,0.18);
      color: #94a3b8; border-radius: 8px; padding: 8px; cursor: pointer; font-size: 13px;
      margin-bottom: 8px;
    }
    .btn-change-pw:hover { background: rgba(255,255,255,0.06); color: #f1f5f9; }

    /* ── Toast ── */
    #toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: #0f172a; border: 1px solid rgba(255,255,255,0.1);
      color: #f1f5f9; padding: 10px 20px; border-radius: 8px; font-size: 14px;
      opacity: 0; transition: opacity 0.2s; pointer-events: none; z-index: 999;
    }
    #toast.show { opacity: 1; }

    .loading { color: #94a3b8; padding: 60px; text-align: center; }
    .empty   { color: #94a3b8; padding: 40px; text-align: center; font-size: 14px; }

    /* ── Mobile ── */
    @media (max-width: 768px) {
      .sidebar { display: none; }

      /* dashboard = 세로 full-height 컨테이너 */
      #dashboard {
        flex-direction: column;
        height: 100dvh;
        overflow: hidden;
      }

      /* main-wrapper = fixedHeader + 스크롤영역 세로 flex */
      .main-wrapper {
        display: flex; flex-direction: column;
        flex: 1; overflow: hidden;
      }

      /* fixedHeader: 상단 고정 영역 (sticky 아님, 진짜 고정) */
      #fixedHeader {
        flex-shrink: 0;
        background: #fff;
      }
      #fixedHeader .inline-tabs    { position: static; margin: 0; border-bottom: 2px solid #e2e8f0; }
      #fixedHeader .rank-tabs-wrap { position: static; margin: 0; padding: 0; border-bottom: 2px solid #e2e8f0; }
      #fixedHeader .attend-header  { position: static; margin: 0; }

      /* mainContent: 스크롤 영역 */
      .main-content {
        margin-left: 0; padding: 0 0 16px;
        flex: 1; overflow-y: auto;
      }

      .attend-header { font-size: 12px; }

      /* inline-tabs / rank-tabs-wrap: 모바일에서 sticky 해제 */
      .inline-tabs    { position: static; }
      .rank-tabs-wrap { position: static; margin: 0; }

      /* 3열 → 1열 */
      .three-col { grid-template-columns: 1fr; overflow: visible; border-radius: 0; border: none; }
      .col-panel { border-right: none; border-bottom: 1px solid #e2e8f0; }
      .col-panel:last-child { border-bottom: none; }
      .col-panel:not(:first-child) .attend-header { display: none; }
      .col-panel:not(:first-child) .col-header    { display: none; }
      /* 모바일: mainContent 안의 탭/헤더는 fixedHeader가 대신하므로 숨김 */
      .main-content .inline-tabs    { display: none; }
      .main-content .rank-tabs-wrap { display: none; }
      .main-content .attend-header  { display: none; }
      .main-content .col-header     { display: none; }
    }
    @media (min-width: 769px) {
      #fixedHeader { display: none; }
      .main-wrapper { display: contents; }
    }
  </style>
</head>
<body>

<!-- 로그인 화면 -->
<div id="loginScreen">
  <div class="login-box">
    <h1>🔐 디인챌 관리자</h1>
    <p>관리자 전용 페이지입니다</p>
    <input type="password" id="adminPwd" placeholder="비밀번호"
           onkeydown="if(event.key==='Enter') doLogin()" />
    <button onclick="doLogin()">로그인</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<!-- 대시보드 -->
<div id="dashboard" style="display:none">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <h1>디인챌 어드민</h1>
      <p>천사님 인스타 챌린지</p>
    </div>
    <div class="nav-item active" id="nav-users"      onclick="showTab('users')">👤 사용자</div>
    <div class="nav-item"        id="nav-attendance" onclick="showTab('attendance')">📊 출석 현황</div>
    <div class="sidebar-footer">
      <button class="btn-change-pw" onclick="openPwModal()">🔑 비밀번호 변경</button>
      <button class="btn-logout" onclick="doLogout()">로그아웃</button>
    </div>
  </aside>
  <div class="main-wrapper">
    <div id="fixedHeader"></div>
    <div class="main-content" id="mainContent">
      <div class="loading">로딩 중...</div>
    </div>
  </div>
</div>

<div id="toast"></div>

<!-- 비밀번호 변경 모달 -->
<div id="pwModal">
  <div class="pw-box">
    <h2>🔑 비밀번호 변경</h2>
    <p>새 비밀번호를 입력해주세요</p>
    <input type="password" id="pwNew" placeholder="새 비밀번호" onkeydown="if(event.key==='Enter') doChangePw()" />
    <input type="password" id="pwConfirm" placeholder="비밀번호 확인" onkeydown="if(event.key==='Enter') doChangePw()" />
    <div class="pw-error" id="pwError"></div>
    <div class="pw-box-btns">
      <button class="btn-pw-cancel" onclick="closePwModal()">취소</button>
      <button class="btn-pw-confirm" onclick="doChangePw()">변경</button>
    </div>
  </div>
</div>

<script src="../js/imported-data.js?v=data1"></script>
<script src="../js/supabase-data.js?v=sb1"></script>
<script src="../js/common.js?v=common12"></script>
<script>
(function () {
  const ADMIN_KEY = 'aW5uaTEhc29uZ3dvbw==';
  const SB_URL    = 'https://rlzbwdvkpjfhxnxkblfg.supabase.co';
  const SB_KEY    = 'sb_publishable_S50LJ8UgfRXDXybLl2IkcA_NpI2ipw0';

  function sbFetch(path) {
    return fetch(`${SB_URL}/rest/v1/${path}`, {
      headers: { apikey: SB_KEY, Authorization: `Bearer ${SB_KEY}` }
    }).then(r => r.json());
  }

  /* ── Auth ── */
  function doLogin() {
    const v = document.getElementById('adminPwd').value;
    try {
      const saved = localStorage.getItem('dc-admin-pw');
      const ok = btoa(v) === ADMIN_KEY || (saved && btoa(v) === saved);
      if (ok) {
        sessionStorage.setItem('dc-admin', '1');
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('dashboard').style.display  = 'flex';
        showTab('users');
        return;
      }
    } catch(_) {}
    document.getElementById('loginError').textContent = '비밀번호가 틀렸습니다.';
  }

  function doLogout() {
    sessionStorage.removeItem('dc-admin');
    location.reload();
  }

  if (sessionStorage.getItem('dc-admin') === '1') {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('fixedHeader').innerHTML = inlineTabsHtml('users');
    document.getElementById('dashboard').style.display  = 'flex';
    setTimeout(() => showTab('users'), 0);
  }

  /* ── Toast ── */
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2200);
  }

  /* ── Navigation ── */
  let currentTab = 'users';
  function showTab(tab) {
    currentTab = tab;
    ['users','attendance'].forEach(t => {
      const el = document.getElementById('nav-' + t);
      if (el) el.classList.toggle('active', t === tab);
    });
    document.querySelectorAll('.mobile-nav-btn').forEach((btn, i) => {
      btn.classList.toggle('active', ['users','attendance'][i] === tab);
    });
    if (tab === 'users')      renderUsers();
    if (tab === 'attendance') renderAttendance('month');
  }

  /* ── Password reset via Supabase ── */
  async function resetPassword(loginId) {
    try {
      await fetch(`${SB_URL}/rest/v1/accounts?login_id=eq.${encodeURIComponent(loginId)}`, {
        method: 'PATCH',
        headers: { apikey: SB_KEY, Authorization: `Bearer ${SB_KEY}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: '123456' }),
      });
      showToast(`✅ ${loginId} 비밀번호 123456으로 초기화`);
    } catch { showToast('오류가 발생했습니다.'); }
  }

  async function deleteAccount(loginId) {
    try {
      await fetch(`${SB_URL}/rest/v1/accounts?login_id=eq.${encodeURIComponent(loginId)}`, {
        method: 'DELETE',
        headers: { apikey: SB_KEY, Authorization: `Bearer ${SB_KEY}` },
      });
      showToast(`🗑️ ${loginId} 삭제됨`);
      renderUsers();
    } catch { showToast('삭제 중 오류가 발생했습니다.'); }
  }

  /* ── Inline tab bar HTML ── */
  function inlineTabsHtml(active) {
    return `<div class="inline-tabs">
      <button class="inline-tab ${active==='users'?'active':''}" onclick="showTab('users')">👤 사용자</button>
      <button class="inline-tab ${active==='attendance'?'active':''}" onclick="showTab('attendance')">📊 출석 현황</button>
    </div>`;
  }

  /* fixedHeader 설정 (모바일: 진짜 고정 / 데스크탑: 숨김) */
  function setFixedHeader(html) {
    const fh = document.getElementById('fixedHeader');
    if (fh) fh.innerHTML = html;
  }

  /* ── Tab 1: 사용자 (Supabase) ── */
  async function renderUsers() {
    const mc = document.getElementById('mainContent');
    setFixedHeader(inlineTabsHtml('users'));
    mc.innerHTML = `<div class="loading">불러오는 중...</div>`;

    const accounts = await sbFetch('accounts?select=login_id,nickname,instagram_id&order=login_id');

    const doRender = () => {
      const attendRows = DC.userRows('month');
      const attendMap = {};
      attendRows.forEach(r => { attendMap[r.instagramId] = r; });

      const tr = (s, n) => s && s.length > n ? s.slice(0, n) + '…' : (s || '');

      const headerHtml = `
        <div class="col-header">
          <span>ID</span><span>닉네임</span><span style="white-space:nowrap">Instagram ID</span><span></span><span></span>
        </div>`;

      setFixedHeader(inlineTabsHtml('users') + headerHtml);

      function attendBadge(a) {
        const r = a.instagram_id ? attendMap[a.instagram_id] : null;
        if (!r) return `<span style="color:#cbd5e1;font-size:11px">-</span>`;
        const cls = r.percent>=80?'pct-green':r.percent>=50?'pct-yellow':'pct-gray';
        return `<span class="pct-badge ${cls}" title="${r.total}번 중 ${r.done}번">${r.percent}%</span>`;
      }

      function rowHtml(a) {
        if (!a) return '';
        return `<div class="member-row">
          <span class="col-id" title="${esc(a.login_id)}">${esc(tr(a.login_id, 12))}</span>
          <span class="col-nick" title="${esc(a.nickname||'')}">${esc(tr(a.nickname, 8) || '-')}</span>
          <span class="col-insta" title="${a.instagram_id||''}">${a.instagram_id ? esc(tr(a.instagram_id, 12)) : '-'}</span>
          <span>${attendBadge(a)}</span>
          <span class="row-actions">
            <button class="reset-btn" title="비밀번호 초기화" onclick="resetPassword('${esc(a.login_id)}')">
              <img src="../assets/images/reset.png" alt="reset" />
            </button>
            <button class="delete-btn" title="계정 삭제" onclick="deleteAccount('${esc(a.login_id)}')">✕</button>
          </span>
        </div>`;
      }

      if (!accounts.length) {
        mc.innerHTML = `${inlineTabsHtml('users')}<div class="empty">등록된 계정이 없습니다.</div>`;
        return;
      }

      const total = accounts.length;
      const col   = Math.ceil(total / 3);
      const cols  = [accounts.slice(0, col), accounts.slice(col, col*2), accounts.slice(col*2)];

      mc.innerHTML = `
        ${inlineTabsHtml('users')}
        <div class="three-col">
          ${cols.map(list => `
            <div class="col-panel">
              ${headerHtml}
              ${list.map((a,i) => rowHtml(a) + (i>0 && (i+1)%10===0 ? '<div class="sep-line"></div>':'')).join('')}
            </div>`).join('')}
        </div>
      `;
    };

    if (window.DC_IMPORTED_DATA) { doRender(); }
    else if (window.DC_DATA_READY) { window.DC_DATA_READY.then(doRender); }
    else { doRender(); }
  }

  /* ── Tab 2: 출석현황 (DC data) ── */
  let attendMode = 'month';
  let attendYear = new Date().getFullYear();

  function attendYears() {
    const s = new Set([new Date().getFullYear()]);
    Object.values(window.DC_IMPORTED_DATA?.months || {}).forEach(m => s.add(m.year));
    return Array.from(s).sort((a,b) => b-a);
  }

  function renderAttendance(mode, year) {
    attendMode = mode || attendMode;
    if (year) attendYear = Number(year);

    const mc = document.getElementById('mainContent');

    const doRender = () => {
      const rows = DC.assignRanks(
        attendMode === 'month' ? DC.userRows('month') : DC.userRows('year', attendYear)
      );

      const tabs = [
        { mode:'month', label:'이달의 랭킹', count: DC.userRows('month').length },
        ...attendYears().map(y => ({ mode:'year', year:y, label:String(y), count: DC.userRows('year',y).length }))
      ];

      const tabHtml = tabs.map(t => {
        const active = t.mode===attendMode && (t.mode==='month' || t.year===attendYear);
        return `<button class="rank-tab ${active?'active':''}"
          onclick="renderAttendance('${t.mode}'${t.year?','+t.year:''})">${t.label} (${t.count}명)</button>`;
      }).join('');

      const attendHeaderHtml = `<div class="attend-header">
        <span>등수</span><span></span><span>닉네임</span><span>출석</span><span>%</span>
      </div>`;

      /* fixedHeader: 인라인탭 + 랭킹탭 + 컬럼헤더 */
      setFixedHeader(`
        ${inlineTabsHtml('attendance')}
        <div class="rank-tabs-wrap">${tabHtml}</div>
        ${attendHeaderHtml}
      `);

      /* mainContent: 데이터 행만 */
      function rowHtml(r) {
        const cls = r.percent>=80?'pct-green':r.percent>=50?'pct-yellow':'pct-gray';
        return `<div class="attend-row">
          <span style="color:#94a3b8">${r.rank}등</span>
          <span>${r.emoji||'🙂'}</span>
          <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.nickname||r.instagramId)}</span>
          <span style="color:#64748b;font-size:13px">${r.total}번중 ${r.done}번</span>
          <span><span class="pct-badge ${cls}">${r.percent}%</span></span>
        </div>`;
      }

      if (!rows.length) {
        // 미션 날짜가 있는지 확인 (오늘 이전)
        const todayKey = DC.dateKey(DC.today);
        const mDates = DC.missionDates(DC.today.getFullYear(), DC.today.getMonth())
          .filter(k => k <= todayKey);
        const emptyMsg = mDates.length > 0
          ? '아직 참여자가 없습니다.'
          : '이달의 미션이 아직 시작되지 않았습니다.';
        mc.innerHTML = `
          ${inlineTabsHtml('attendance')}
          <div class="rank-tabs-wrap">${tabHtml}</div>
          ${attendHeaderHtml}
          <div class="empty">${emptyMsg}</div>`;
        return;
      }

      const col  = Math.ceil(rows.length / 3);
      const cols = [rows.slice(0,col), rows.slice(col,col*2), rows.slice(col*2)];
      mc.innerHTML = `
        ${inlineTabsHtml('attendance')}
        <div class="rank-tabs-wrap">${tabHtml}</div>
        <div class="three-col">
          ${cols.map(list => `<div class="col-panel">${attendHeaderHtml}${list.map(rowHtml).join('')}</div>`).join('')}
        </div>`;
    };

    if (window.DC_IMPORTED_DATA) { doRender(); }
    else if (window.DC_DATA_READY) {
      setFixedHeader(inlineTabsHtml('attendance'));
      mc.innerHTML = `${inlineTabsHtml('attendance')}<div class="loading">데이터 로딩 중...</div>`;
      window.DC_DATA_READY.then(doRender);
    } else { doRender(); }
  }

  /* ── Helpers ── */
  function esc(s) {
    return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
  }

  /* ── Password Change ── */
  function openPwModal() {
    document.getElementById('pwNew').value = '';
    document.getElementById('pwConfirm').value = '';
    document.getElementById('pwError').textContent = '';
    document.getElementById('pwModal').classList.add('open');
    setTimeout(() => document.getElementById('pwNew').focus(), 50);
  }

  function closePwModal() {
    document.getElementById('pwModal').classList.remove('open');
  }

  function doChangePw() {
    const pw1 = document.getElementById('pwNew').value;
    const pw2 = document.getElementById('pwConfirm').value;
    const err = document.getElementById('pwError');
    if (!pw1) { err.textContent = '새 비밀번호를 입력해주세요.'; return; }
    if (pw1.length < 4) { err.textContent = '비밀번호는 4자 이상이어야 합니다.'; return; }
    if (pw1 !== pw2) { err.textContent = '비밀번호가 일치하지 않습니다.'; return; }
    localStorage.setItem('dc-admin-pw', btoa(pw1));
    closePwModal();
    showToast('✅ 비밀번호가 변경되었습니다.');
  }

  /* ── Expose globals ── */
  window.doLogin          = doLogin;
  window.doLogout         = doLogout;
  window.showTab          = showTab;
  window.resetPassword    = resetPassword;
  window.deleteAccount    = deleteAccount;
  window.renderAttendance = renderAttendance;
  window.openPwModal      = openPwModal;
  window.closePwModal     = closePwModal;
  window.doChangePw       = doChangePw;
})();
</script>
</body>
</html>
